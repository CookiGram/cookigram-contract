[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookigram-contract"
version = "1.1.0"
description = "Public versioned content contract for CookiGram"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cookigram-contract = "cookigram_contract.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cookigram_contract*"]
